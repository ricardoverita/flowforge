name: flowforge

x-app: &app
  restart: unless-stopped
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  stop_grace_period: 20s
  cpus: 0.50
  mem_limit: 256m
  volumes:
    - runtime-secrets:/run/secrets:ro
  environment: &environment
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_USER: flowforge
    DATABASE_NAME: flowforge
    DATABASE_SSLMODE: disable
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    NATS_URL: nats://nats:4222
    NATS_TOKEN_FILE: /run/secrets/nats_token
    API_TOKEN: ${API_TOKEN:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  depends_on:
    migrate:
      condition: service_completed_successfully
    nats:
      condition: service_healthy
  healthcheck:
    test: [CMD, /flowforge, healthcheck]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  secrets:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    entrypoint: [/bin/sh, /init-secrets.sh]
    volumes:
      - ./deployments/docker/init-secrets.sh:/init-secrets.sh:ro
      - runtime-secrets:/secrets
      - postgres-admin-secrets:/admin-secrets
      - postgres-data:/postgres-data
      - nats-data:/nats-data
      - grafana-data:/grafana-data
      - prometheus-data:/prometheus-data
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 32m

  postgres:
    image: postgres:17-alpine
    user: "70:70"
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/admin-secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-admin-secrets:/run/admin-secrets:ro
      - ./deployments/docker/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
      - runtime-secrets:/run/secrets:ro
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/run/postgresql:size=16m,uid=70,gid=70"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 128m
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.15.0-alpine
    user: "1000:1000"
    command: [-c, /etc/nats/nats.conf]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    volumes:
      - ./deployments/docker/nats.conf:/etc/nats/nats.conf:ro
      - runtime-secrets:/run/secrets:ro
      - nats-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.50
    mem_limit: 256m
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  flowforge-api:
    <<: *app
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      <<: *environment
      HTTP_ADDR: :8080
      SERVICE_NAME: flowforge-api

  flowforge-engine:
    <<: *app
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: engine
    environment:
      <<: *environment
      HTTP_ADDR: :8081
      SERVICE_NAME: flowforge-engine
      POLL_INTERVAL: 250ms

  example-worker:
    <<: *app
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: worker
    environment:
      <<: *environment
      HTTP_ADDR: :8082
      SERVICE_NAME: example-worker
      WORKER_DELAY: ${WORKER_DELAY:-200ms}
      WORKER_FAIL_TASK: ${WORKER_FAIL_TASK:-}
      WORKER_FAIL_ATTEMPTS: ${WORKER_FAIL_ATTEMPTS:-0}

  web:
    profiles: [ui]
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      FLOWFORGE_API_URL: http://flowforge-api:8080
      FLOWFORGE_API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on:
      flowforge-api:
        condition: service_healthy

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    user: "65532:65532"
    command: [--config=/etc/otelcol/config.yml]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./deployments/docker/otel-collector.yml:/etc/otelcol/config.yml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0-busybox
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployments/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: flowforge
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - runtime-secrets:/run/secrets:ro
      - ./deployments/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      secrets:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  nats-data:
  runtime-secrets:
  postgres-admin-secrets:
  grafana-data:
  prometheus-data:
